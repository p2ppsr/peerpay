name: Payment source checks
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  payments:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.22.1'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npx tsc --noEmit
      - run: npm test -- --reporter=json --outputFile=payment-test-results.json
      - name: Require complete passing source coverage
        run: |
          node --input-type=module - <<'JS'
          import assert from 'node:assert/strict'
          import fs from 'node:fs'
          const report = JSON.parse(fs.readFileSync('payment-test-results.json', 'utf8'))
          assert.equal(report.success, true)
          assert.equal(report.numFailedTests, 0)
          assert.equal(report.numPendingTests, 0)
          assert.equal(report.numTodoTests, 0)
          assert(report.numPassedTests >= 28)
          const safety = report.testResults.find(result => result.name.endsWith('/paymentCompatibilitySafety.test.ts'))
          assert(safety && safety.assertionResults.length === 9)
          assert(safety.assertionResults.every(result => result.status === 'passed'))
          JS
      - run: npm run build
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: payment-source-results
          path: frontend/payment-test-results.json
          if-no-files-found: warn
